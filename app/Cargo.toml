[package]
name = "toolbelt-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "toolbelt"
path = "src/main.rs"

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
arboard = "3"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
png = "0.17"
# Uniquement pour sérialiser le chemin poussé dans la fenêtre de
# confirmation. Déjà dans l'arbre via Tauri, pas une dépendance de plus.
serde_json = "1"
toolbelt-ddc = { path = "../crates/ddc" }
toolbelt-audio = { path = "../crates/audio" }
toolbelt-capture = { path = "../crates/capture" }
