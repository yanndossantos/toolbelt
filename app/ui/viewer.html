<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Capture</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #17181b;
  }

  #image {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
</style>
</head>
<body>
  <img id="image" alt="Capture d'écran" />

<script>
window.showCapture = function (pngData) {
  document.getElementById("image").src = pngData;
};
</script>
</body>
</html>
