<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Toolbelt</title>
<style>
  :root {
    --bg: #202124;
    --bg-hover: #2c2e33;
    --bg-active: #34363d;
    --fg: #e8eaed;
    --fg-dim: #9aa0a6;
    --accent: #6ea8fe;
    --line: #34363d;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: transparent;
    overflow: hidden;
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    font-size: 13px;
    color: var(--fg);
    user-select: none;
    cursor: default;
  }

  /* Hauteur naturelle : la fenêtre se cale dessus, pas l'inverse. */
  #panel {
    display: flex;
    flex-direction: column;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }

  section { padding: 12px 14px; }
  section + section { border-top: 1px solid var(--line); }

  h2 {
    margin: 0 0 10px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--fg-dim);
  }

  .section-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .section-heading h2 { margin-bottom: 10px; }
  .section-action {
    margin: -4px -7px 6px 0;
    padding: 3px 7px;
    border: none;
    border-radius: 5px;
    background: none;
    color: var(--fg-dim);
    font: inherit;
    cursor: default;
  }
  .section-action:hover { background: var(--bg-hover); color: var(--fg); }
  .section-action:disabled { opacity: .5; }

  .row { margin-bottom: 12px; }
  .row:last-child { margin-bottom: 0; }

  .row-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
  }
  .row-head .val { color: var(--fg-dim); font-variant-numeric: tabular-nums; }
  .row.off { opacity: .4; }

  input[type=range] {
    width: 100%;
    height: 18px;
    margin: 0;
    background: transparent;
    -webkit-appearance: none;
    appearance: none;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 4px;
    border-radius: 2px;
    background: var(--bg-active);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    margin-top: -5px;
    border-radius: 50%;
    background: var(--accent);
    border: 3px solid var(--bg);
  }
  input[type=range]:active::-webkit-slider-thumb { transform: scale(1.15); }

  .device {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 7px 8px;
    margin: 0 -8px;
    border-radius: 6px;
  }
  .device:hover { background: var(--bg-hover); }
  .device .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: transparent;
    flex: none;
  }
  .device.current .dot { background: var(--accent); }
  .device .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 14px;
    border-top: 1px solid var(--line);
    color: var(--fg-dim);
    font-size: 12px;
  }
  footer label { display: flex; align-items: center; gap: 6px; }
  footer button {
    background: none;
    border: none;
    padding: 3px 7px;
    border-radius: 5px;
    color: var(--fg-dim);
    font: inherit;
    cursor: default;
  }
  footer button:hover { background: var(--bg-hover); color: var(--fg); }

  .empty { color: var(--fg-dim); font-style: italic; }

  footer { flex-direction: column; align-items: stretch; gap: 5px; }
  .footer-row { display: flex; align-items: center; justify-content: space-between; }
  .note { font-size: 11px; line-height: 1.35; }
  kbd {
    padding: 1px 5px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--bg-active);
    color: var(--fg);
    font: inherit;
    font-size: 11px;
  }
  .note.err { color: #f28b82; }
  .note.warn { color: #fdd663; }

  .mix { display: flex; align-items: center; gap: 9px; margin-bottom: 11px; }
  .mix:last-child { margin-bottom: 0; }
  .mix .sliders { flex: 1; min-width: 0; }
  .mix.master { padding-bottom: 11px; border-bottom: 1px solid var(--line); }

  .mute {
    flex: none;
    width: 26px; height: 26px;
    display: grid; place-items: center;
    border: none; border-radius: 6px;
    background: none; color: var(--fg-dim);
    font-size: 14px; cursor: default; padding: 0;
  }
  .mute:hover { background: var(--bg-hover); color: var(--fg); }
  .mix.off .sliders { opacity: .4; }
  .mix.off .app-icon { opacity: .35; filter: grayscale(1); }

  .app-icon {
    flex: none;
    width: 20px; height: 20px;
    image-rendering: -webkit-optimize-contrast;
  }
  .app-icon.placeholder {
    display: grid; place-items: center;
    border-radius: 4px;
    background: var(--bg-active);
    color: var(--fg-dim);
    font-size: 10px; font-weight: 600;
  }
</style>
</head>
<body>
<div id="panel">
  <section>
    <div class="section-heading">
      <h2>Luminosité</h2>
      <button class="section-action" id="refresh-monitors">Refresh monitors</button>
    </div>
    <div id="monitors"><div class="empty">Recherche des écrans…</div></div>
  </section>

  <section>
    <h2>Sortie audio</h2>
    <div id="audio"><div class="empty">Chargement…</div></div>
  </section>

  <section id="mixer-section">
    <h2>Mélangeur</h2>
    <div id="mixer"><div class="empty">Chargement…</div></div>
  </section>

  <footer>
    <div class="footer-row">
      <span>Capture d'écran <kbd id="hotkey">…</kbd></span>
      <button id="open-shots">Dossier</button>
    </div>
    <div class="note err" id="hotkey-note" hidden></div>
    <div class="footer-row">
      <label><input type="checkbox" id="autostart"> Démarrer avec Windows</label>
      <button id="quit">Quitter</button>
    </div>
    <div class="note" id="autostart-note" hidden></div>
  </footer>
</div>

<script>
const invoke = window.__TAURI__.core.invoke;

// Le matériel absorbe environ 16 écritures par seconde. Inutile d'en
// envoyer plus : le worker côté Rust ne garderait que la dernière de toute
// façon, mais autant ne pas saturer le canal.
const THROTTLE_MS = 60;
const lastSent = new Map();
const queued = new Map();

function sendBrightness(index, percent) {
  const now = performance.now();
  const last = lastSent.get(index) || 0;

  if (now - last >= THROTTLE_MS) {
    lastSent.set(index, now);
    invoke("set_brightness", { index, percent });
    return;
  }

  // Trop tôt : on garde la valeur et on la posera à la fin de la fenêtre.
  queued.set(index, percent);
  if (queued.get("timer_" + index)) return;
  queued.set("timer_" + index, true);
  setTimeout(() => {
    queued.delete("timer_" + index);
    const v = queued.get(index);
    if (v === undefined) return;
    queued.delete(index);
    lastSent.set(index, performance.now());
    invoke("set_brightness", { index, percent: v });
  }, THROTTLE_MS - (now - last));
}

async function renderMonitors() {
  const list = await invoke("list_monitors");
  const box = document.getElementById("monitors");

  if (!list.length) {
    box.innerHTML = '<div class="empty">Aucun écran DDC/CI détecté</div>';
    return;
  }

  box.innerHTML = "";
  for (const m of list) {
    const row = document.createElement("div");
    row.className = "row" + (m.available ? "" : " off");

    const head = document.createElement("div");
    head.className = "row-head";
    const name = document.createElement("span");
    name.textContent = m.name;
    const val = document.createElement("span");
    val.className = "val";
    val.textContent = m.brightness + " %";
    head.append(name, val);

    const slider = document.createElement("input");
    slider.type = "range";
    slider.min = 0;
    slider.max = 100;
    slider.value = m.brightness;
    slider.disabled = !m.available;
    slider.addEventListener("input", () => {
      const v = Number(slider.value);
      val.textContent = v + " %";
      sendBrightness(m.index, v);
    });

    row.append(head, slider);
    box.append(row);
  }
}

document.getElementById("refresh-monitors").addEventListener("click", async (event) => {
  const button = event.currentTarget;
  button.disabled = true;
  try {
    await invoke("reload_monitors");
    await new Promise(resolve => setTimeout(resolve, 300));
    await renderMonitors();
    syncHeight();
  } catch (e) {
    console.error("rafraîchissement des écrans", e);
  } finally {
    button.disabled = false;
  }
});

async function renderAudio() {
  const box = document.getElementById("audio");
  let list;
  try {
    list = await invoke("list_audio");
  } catch (e) {
    box.innerHTML = '<div class="empty">Erreur : ' + e + "</div>";
    return;
  }

  box.innerHTML = "";
  for (const d of list) {
    const el = document.createElement("div");
    el.className = "device" + (d.is_default ? " current" : "");
    el.innerHTML = '<span class="dot"></span>';

    const label = document.createElement("span");
    label.className = "label";
    label.textContent = d.name;
    el.append(label);

    el.addEventListener("click", async () => {
      try {
        await invoke("set_audio", { id: d.id });
        // Les sessions sont attachées au périphérique : la liste change.
        mixKey = "";
        await Promise.all([renderAudio(), renderMixer()]);
      } catch (e) {
        console.error(e);
      }
    });

    box.append(el);
  }
}

// --- Mélangeur ---------------------------------------------------------
//
// Les lignes sont réutilisées d'un rafraîchissement à l'autre plutôt que
// reconstruites : sinon le slider serait recréé sous le curseur pendant
// qu'on le tire. On ne reconstruit que si la liste des processus change.

let mixRows = new Map();   // pid -> { el, slider, mute }
let mixKey = "";           // signature de la liste, pour détecter un changement
let dragging = null;       // pid en cours de manipulation, ou "master"

// --- Icônes ------------------------------------------------------------
//
// Une icône ne change pas pendant la vie d'un processus : on la demande une
// seule fois par PID. Sans ce cache, le sondage à la seconde relancerait
// une extraction GDI complète pour chaque application.

const iconCache = new Map();

function rgbaToDataUrl(icon) {
  const bin = atob(icon.rgba);
  const px = new Uint8ClampedArray(bin.length);
  for (let i = 0; i < bin.length; i++) px[i] = bin.charCodeAt(i);

  const canvas = document.createElement("canvas");
  canvas.width = icon.width;
  canvas.height = icon.height;
  canvas
    .getContext("2d")
    .putImageData(new ImageData(px, icon.width, icon.height), 0, 0);
  return canvas.toDataURL();
}

async function iconFor(pid) {
  if (iconCache.has(pid)) return iconCache.get(pid);

  let url = null;
  try {
    const icon = await invoke("get_icon", { pid });
    if (icon) url = rgbaToDataUrl(icon);
  } catch (e) {
    console.error("icône", pid, e);
  }
  iconCache.set(pid, url);
  return url;
}

/// Vignette d'une application : l'icône si on l'a, sinon son initiale.
function makeIcon(label, pid) {
  if (pid === "master" || pid === undefined) {
    const el = document.createElement("div");
    el.className = "app-icon placeholder";
    el.textContent = "\u{1F50A}";
    return el;
  }

  const el = document.createElement("div");
  el.className = "app-icon placeholder";
  el.textContent = (label[0] || "?").toUpperCase();

  iconFor(pid).then((url) => {
    if (!url) return;
    const img = document.createElement("img");
    img.className = "app-icon";
    img.src = url;
    el.replaceWith(img);
    syncHeight();
  });

  return el;
}

function makeMixRow(key, label, onVolume, onMute) {
  const el = document.createElement("div");
  el.className = "mix" + (key === "master" ? " master" : "");

  const mute = document.createElement("button");
  mute.className = "mute";
  mute.textContent = "\u{1F50A}";

  const sliders = document.createElement("div");
  sliders.className = "sliders";

  const head = document.createElement("div");
  head.className = "row-head";
  const name = document.createElement("span");
  name.className = "label";
  name.textContent = label;
  const val = document.createElement("span");
  val.className = "val";
  head.append(name, val);

  const slider = document.createElement("input");
  slider.type = "range";
  slider.min = 0;
  slider.max = 100;

  slider.addEventListener("pointerdown", () => { dragging = key; });
  slider.addEventListener("pointerup", () => { dragging = null; });
  slider.addEventListener("input", () => {
    const v = Number(slider.value);
    val.textContent = v + " %";
    onVolume(v / 100);
  });
  mute.addEventListener("click", () => onMute());

  sliders.append(head, slider);
  el.append(makeIcon(label, key), sliders, mute);

  return { el, slider, val, mute, name };
}

function applyMixRow(row, volume, muted) {
  // Ne jamais écraser la position d'un slider que l'utilisateur tient. Le
  // pointeur est filtré par l'appelant via `dragging` ; ici on couvre le
  // clavier, où le slider garde le focus entre deux flèches.
  const pct = Math.round(volume * 100);
  if (row.slider !== document.activeElement) {
    row.slider.value = pct;
    row.val.textContent = pct + " %";
  }
  row.mute.textContent = muted ? "\u{1F507}" : "\u{1F50A}";
  row.el.classList.toggle("off", muted);
}

async function renderMixer() {
  const box = document.getElementById("mixer");

  let master, sessions;
  try {
    [master, sessions] = await Promise.all([
      invoke("get_master"),
      invoke("list_sessions"),
    ]);
  } catch (e) {
    box.innerHTML = '<div class="empty">Erreur : ' + e + "</div>";
    mixKey = "";
    return;
  }

  const key = "master|" + sessions.map((x) => x.pid + ":" + x.name).join(",");

  if (key !== mixKey) {
    mixKey = key;
    mixRows = new Map();
    box.innerHTML = "";

    const m = makeMixRow(
      "master",
      "Volume général",
      (v) => invoke("set_master_volume", { volume: v }).catch(console.error),
      () => {
        invoke("set_master_mute", { muted: !m.el.classList.contains("off") })
          .then(renderMixer)
          .catch(console.error);
      }
    );
    mixRows.set("master", m);
    box.append(m.el);

    for (const sess of sessions) {
      const pid = sess.pid;
      const row = makeMixRow(
        pid,
        sess.name,
        (v) => invoke("set_session_volume", { pid, volume: v }).catch(console.error),
        () => {
          invoke("set_session_mute", {
            pid,
            muted: !row.el.classList.contains("off"),
          })
            .then(renderMixer)
            .catch(console.error);
        }
      );
      mixRows.set(pid, row);
      box.append(row.el);
    }

    if (!sessions.length) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "Aucune application ne joue de son";
      box.append(empty);
    }
  }

  const masterRow = mixRows.get("master");
  if (masterRow && dragging !== "master") {
    applyMixRow(masterRow, master.volume, master.muted);
  }
  for (const sess of sessions) {
    const row = mixRows.get(sess.pid);
    if (row && dragging !== sess.pid) {
      applyMixRow(row, sess.volume, sess.muted);
    }
  }
}

// --- Hauteur de la fenêtre ---------------------------------------------
//
// Plutôt qu'une barre de défilement, on dit à Tauri la hauteur qu'il faut.
// Le garde-fou des 2 px évite la boucle redimensionnement → reflow →
// redimensionnement.

let lastHeight = 0;

function syncHeight() {
  const h = Math.ceil(
    document.getElementById("panel").getBoundingClientRect().height
  );
  if (!h || Math.abs(h - lastHeight) < 2) return;
  lastHeight = h;
  invoke("set_flyout_height", { height: h }).catch(console.error);
}

async function refresh() {
  await Promise.all([renderMonitors(), renderAudio(), renderMixer()]);
  syncHeight();
}

// Le flyout n'est jamais détruit, donc il ne reçoit pas d'événement
// d'ouverture. Le focus fait office de signal.
//
// Les sessions apparaissent et disparaissent sans prévenir, donc on
// rafraîchit périodiquement — mais uniquement tant que le flyout est
// visible. Fermé, l'app ne fait rien du tout. (Le propre est
// IAudioSessionNotification, à faire plus tard.)
let poll = null;

window.addEventListener("focus", () => {
  refresh();
  if (poll === null)
    poll = setInterval(() => renderMixer().then(syncHeight), 1000);
});

window.addEventListener("blur", () => {
  if (poll !== null) {
    clearInterval(poll);
    poll = null;
  }
  dragging = null;
});

document.getElementById("quit").addEventListener("click", () => invoke("quit"));

// --- Capture d'écran ----------------------------------------------------

const hotkeyEl = document.getElementById("hotkey");
const hotkeyNote = document.getElementById("hotkey-note");

function showHotkeyNote(text) {
  hotkeyNote.hidden = !text;
  hotkeyNote.textContent = text || "";
  syncHeight();
}

document.getElementById("open-shots").addEventListener("click", () => {
  invoke("open_screenshots_dir").catch((e) => showHotkeyNote("Échec : " + e));
});

/// Le libellé vient du backend plutôt que d'être écrit en dur ici : il n'y a
/// qu'un seul endroit où la combinaison est définie, et l'affichage ne peut
/// pas mentir sur ce qui est réellement enregistré.
async function refreshHotkey() {
  try {
    hotkeyEl.textContent = await invoke("get_hotkey_label");
  } catch (e) {
    return;
  }
  // Un raccourci pris par une autre application doit se voir : sans ça,
  // l'utilisateur appuie dans le vide sans savoir pourquoi.
  const err = await invoke("get_hotkey_error").catch(() => null);
  if (err) showHotkeyNote(err);
}

// --- Démarrage automatique ---------------------------------------------

const auto = document.getElementById("autostart");
const autoNote = document.getElementById("autostart-note");

function showNote(text, kind) {
  if (!text) {
    autoNote.hidden = true;
    autoNote.textContent = "";
  } else {
    autoNote.hidden = false;
    autoNote.textContent = text;
    autoNote.className = "note " + (kind || "");
  }
  syncHeight();
}

async function refreshAutostart() {
  let state;
  try {
    state = await invoke("get_autostart");
  } catch (e) {
    showNote("Registre inaccessible : " + e, "err");
    return;
  }

  auto.checked = state.enabled;
  auto.title = state.command;

  if (state.error) {
    showNote(state.error, "err");
  } else if (state.other) {
    // Une entrée existe mais désigne un autre binaire : typiquement une
    // ancienne copie. Il faut le dire, sinon la case décochée est trompeuse.
    showNote("Une autre copie est déjà enregistrée : " + state.other, "warn");
  } else if (state.enabled && /\\target\\(debug|release)\\/i.test(state.command)) {
    showNote(
      "Enregistré depuis le dossier de compilation. Déplace l'exe ailleurs, sinon un cargo clean cassera le démarrage.",
      "warn"
    );
  } else {
    showNote(null);
  }
}

auto.addEventListener("change", async () => {
  const wanted = auto.checked;
  try {
    await invoke("set_autostart", { enabled: wanted });
  } catch (e) {
    // Remettre la case dans son état réel : ne pas laisser croire que
    // c'est fait alors que l'écriture a échoué.
    auto.checked = !wanted;
    showNote("Échec : " + e, "err");
    return;
  }
  await refreshAutostart();
});

(async () => {
  await refreshHotkey();
  await refreshAutostart();
  await invoke("reload_monitors");
  setTimeout(refresh, 300);
})();
</script>
</body>
</html>
